# Repo-level tooling. Each service keeps its own pyproject.toml with its
# runtime dependencies and an identical [tool.ruff]/[tool.mypy] section;
# this file covers what lives outside a service — the e2e suite and scripts.
[project]
name = "marketplace-workspace"
version = "0.1.0"
description = "Multi-vendor marketplace backend — workspace tooling"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
include = ["e2e/**", "scripts/**"]
exclude = [".venv", ".git", "**/alembic/**", "**/migrations/**"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "COM", "C90", "DJ", "EXE", "T10", "TID",
    "RUF001", "RUF002", "RUF003", "TD003", "FIX002",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "EM101", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# tests assert on literals and reach into fixtures by design
"e2e/**" = ["S101", "PLR2004", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["e2e", "scripts"]
exclude = ['\.venv', 'alembic', 'migrations']
