[project]
name = "order-service"
version = "0.1.0"
description = "Order Service — Multi-Vendor Marketplace"
authors = [
    { name = "Доманский Александр", email = "89213688247@yandex.ru" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uvicorn[standard] (==0.30.1)",
    "fastapi[all] (==0.111.0)",
    "sqlalchemy[asyncio] (>=2.0.0)",
    "asyncpg (>=0.29.0)",
    "alembic (==1.17.2)",
    "redis (>=5.0.0)",
    "python-dotenv (==1.0.1)",
    "pydantic-settings (>=2.0.0)",
    "orjson (==3.11.7)",
    "backoff (==2.2.1)",
    "rodi (>=2.0.0)",
    "python-jose[cryptography] (>=3.3.0)",
    "aiohttp (>=3.9.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[dependency-groups]
dev = [
    "ruff (==0.15.12)",
    "mypy (==1.20.2)",
    "pre-commit (==4.5.1)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
include = ["src/**"]
exclude = [".venv", ".git", "migrations", "scripts", "alembic"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "COM", "C90", "DJ", "EXE", "T10", "TID",
    "RUF001", "RUF002", "RUF003", "TD003", "FIX002",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "EM101", "TRY003",
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
exclude = ['\.venv', 'migration', 'alembic', 'tests', 'scripts']
