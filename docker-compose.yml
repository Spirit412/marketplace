# Root docker-compose.yml — orchestrates all 10 microservices.
# Each service has its own docker-compose.yml for standalone dev.

services:

  mp-auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: mp-${AUTH_APP_NAME}
    hostname: mp-${AUTH_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - auth-service/.env
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    networks:
      - proxynet

  mp-catalog-service:
    build:
      context: ./catalog-service
