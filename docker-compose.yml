# Root docker-compose.yml — orchestrates all 10 microservices.
# Each service has its own docker-compose.yml for standalone dev.

services:

  mp-auth-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${AUTH_PORT}
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: mp-${AUTH_APP_NAME}
    hostname: mp-${AUTH_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - auth-service/.env
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    networks:
      - proxynet

  mp-catalog-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${CATALOG_PORT}
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: mp-${CATALOG_APP_NAME}
    hostname: mp-${CATALOG_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - catalog-service/.env
    ports:
      - "${CATALOG_PORT}:${CATALOG_PORT}"
    networks:
      - proxynet

  mp-order-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${ORDER_PORT}
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: mp-${ORDER_APP_NAME}
    hostname: mp-${ORDER_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - order-service/.env
    ports:
      - "${ORDER_PORT}:${ORDER_PORT}"
    networks:
      - proxynet

  mp-payment-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${PAYMENT_PORT}
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: mp-${PAYMENT_APP_NAME}
    hostname: mp-${PAYMENT_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - payment-service/.env
    ports:
      - "${PAYMENT_PORT}:${PAYMENT_PORT}"
    networks:
      - proxynet

  mp-notification-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${NOTIFICATION_PORT}
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: mp-${NOTIFICATION_APP_NAME}
    hostname: mp-${NOTIFICATION_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - notification-service/.env
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    networks:
      - proxynet

  mp-scheduler-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${SCHEDULER_PORT}
    build:
      context: ./scheduler-service
      dockerfile: Dockerfile
    container_name: mp-${SCHEDULER_APP_NAME}
    hostname: mp-${SCHEDULER_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - scheduler-service/.env
    ports:
      - "${SCHEDULER_PORT}:${SCHEDULER_PORT}"
    networks:
      - proxynet

  mp-report-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${REPORT_PORT}
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: mp-${REPORT_APP_NAME}
    hostname: mp-${REPORT_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - report-service/.env
    ports:
      - "${REPORT_PORT}:${REPORT_PORT}"
    networks:
      - proxynet

  mp-inventory-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${INVENTORY_PORT}
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: mp-${INVENTORY_APP_NAME}
    hostname: mp-${INVENTORY_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - inventory-service/.env
    ports:
      - "${INVENTORY_PORT}:${INVENTORY_PORT}"
    networks:
      - proxynet

  mp-dictionary-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${DICTIONARY_PORT}
    build:
      context: ./dictionary-service
      dockerfile: Dockerfile
    container_name: mp-${DICTIONARY_APP_NAME}
    hostname: mp-${DICTIONARY_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - dictionary-service/.env
    ports:
      - "${DICTIONARY_PORT}:${DICTIONARY_PORT}"
    networks:
      - proxynet

  mp-import-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${IMPORT_PORT}
    build:
      context: ./import-service
      dockerfile: Dockerfile
    container_name: mp-${IMPORT_APP_NAME}
    hostname: mp-${IMPORT_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - import-service/.env
    ports:
      - "${IMPORT_PORT}:${IMPORT_PORT}"
    networks:
      - proxynet

  mp-api-service:
    command: uvicorn src.main:app --host 0.0.0.0 --port ${API_PORT}
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: mp-${API_APP_NAME}
    hostname: mp-${API_APP_NAME}
    restart: on-failure
    tty: true
    env_file:
      - api-service/.env
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - proxynet

  mp-postgres:
    image: postgres:16-alpine
    container_name: mp-postgres
    hostname: mp-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata_mp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxynet

  mp-redis:
    image: redis:7-alpine
    container_name: mp-redis
    hostname: mp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxynet

  mp-redis-admin:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: mp-redis-admin
    hostname: mp-redis-admin
    restart: unless-stopped
    environment:
      REDIS_HOST: mp-redis
      REDIS_PORT: 6379
    ports:
      - "8082:8081"
    networks:
      - proxynet

  mp-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mp-rabbitmq
    hostname: mp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - proxynet

  # Фронтенд отключён по умолчанию — при локальной разработке запускается npm run dev.
  # Чтобы запустить в Docker: docker compose --profile frontend up -d
  mp-frontend:
    profiles: [frontend]
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mp-frontend
    restart: on-failure
    tty: true
    env_file:
      - frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/components.json:/app/components.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/.env:/app/.env
      - ./frontend/.env.docker:/app/.env.docker
    networks:
      - proxynet
volumes:
  pgdata_mp:

networks:
  proxynet:
    driver: bridge
    external: true
    name: proxynet
