repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: mixed-line-ending
        args: [ "--fix=lf" ]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: name-tests-test
        exclude: '^tests/utils/.*$'
        args:
          - --pytest-test-first

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        language: system
        entry: ruff check --fix
        pass_filenames: false

      - id: check-var-names
        name: check-var-names
        language: system
        entry: python3 ../../scripts/check_var_names.py src/
        pass_filenames: false

      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format
        pass_filenames: false

      - id: check-var-names
        name: check-var-names
        language: system
        entry: python3 ../../scripts/check_var_names.py src/
        pass_filenames: false

      - id: mypy
        name: mypy
        language: system
        entry: mypy src
        pass_filenames: false

      - id: check-var-names
        name: check-var-names
        language: system
        entry: python3 ../../scripts/check_var_names.py src/
        pass_filenames: false
